<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Same warm saffron → orange → red gradient, full bleed -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FCD34D"/>
      <stop offset="55%"  stop-color="#F97316"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background — Android clips this to the shape it wants -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Safe zone ≈ inner 80% (radius 205px from centre 256,256).
       Keep ALL visible content within that circle. -->

  <!-- Plate ring — slightly smaller so rim is within safe zone -->
  <circle cx="256" cy="268" r="160"
          fill="rgba(255,255,255,0.10)"
          stroke="rgba(255,255,255,0.28)" stroke-width="4.5"/>

  <!-- Bold white "D" -->
  <text x="254" y="326"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="216" font-weight="bold"
        text-anchor="middle"
        fill="white">D</text>

  <!-- Four katori dots, scaled to fit inside safe zone (~r≤160 from centre) -->

  <!-- Top-left · green -->
  <circle cx="150" cy="148" r="29" fill="#16A34A"/>
  <circle cx="150" cy="148" r="29" fill="none" stroke="white" stroke-width="3.5" opacity="0.75"/>

  <!-- Top-right · yellow -->
  <circle cx="362" cy="144" r="26" fill="#FACC15"/>
  <circle cx="362" cy="144" r="26" fill="none" stroke="white" stroke-width="3.5" opacity="0.75"/>

  <!-- Bottom-right · red -->
  <circle cx="365" cy="370" r="27" fill="#DC2626"/>
  <circle cx="365" cy="370" r="27" fill="none" stroke="white" stroke-width="3.5" opacity="0.75"/>

  <!-- Bottom-left · purple -->
  <circle cx="148" cy="366" r="24" fill="#A855F7"/>
  <circle cx="148" cy="366" r="24" fill="none" stroke="white" stroke-width="3.5" opacity="0.75"/>
</svg>
