<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Warm saffron → vibrant orange → deep red — evokes Indian spices -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#FCD34D"/>
      <stop offset="55%"  stop-color="#F97316"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle thali (plate) ring -->
  <circle cx="256" cy="268" r="185"
          fill="rgba(255,255,255,0.10)"
          stroke="rgba(255,255,255,0.30)" stroke-width="5"/>

  <!-- Bold white "D" -->
  <text x="254" y="342"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="248" font-weight="bold"
        text-anchor="middle"
        fill="white">D</text>

  <!-- Four coloured dots — the four "katoris" in a thali -->

  <!-- Top-left · green (sabzi / herbs) -->
  <circle cx="124" cy="122" r="35" fill="#16A34A"/>
  <circle cx="124" cy="122" r="35" fill="none" stroke="white" stroke-width="4" opacity="0.75"/>

  <!-- Top-right · yellow (dal / turmeric) -->
  <circle cx="390" cy="118" r="31" fill="#FACC15"/>
  <circle cx="390" cy="118" r="31" fill="none" stroke="white" stroke-width="4" opacity="0.75"/>

  <!-- Bottom-right · red (chilli / achaar) -->
  <circle cx="393" cy="394" r="33" fill="#DC2626"/>
  <circle cx="393" cy="394" r="33" fill="none" stroke="white" stroke-width="4" opacity="0.75"/>

  <!-- Bottom-left · purple (brinjal / mithai) -->
  <circle cx="122" cy="390" r="29" fill="#A855F7"/>
  <circle cx="122" cy="390" r="29" fill="none" stroke="white" stroke-width="4" opacity="0.75"/>
</svg>
