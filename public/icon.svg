<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a7050"/>
      <stop offset="100%" stop-color="#0e2e1a"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Decorative plate rings -->
  <circle cx="256" cy="278" r="168" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="10"/>
  <circle cx="256" cy="278" r="136" fill="rgba(255,255,255,0.04)"/>

  <!-- Gold "D" monogram -->
  <text x="254" y="340"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="230"
        font-weight="700"
        text-anchor="middle"
        fill="#e8a020">D</text>

  <!-- Fork (left) -->
  <line x1="122" y1="112" x2="122" y2="178" stroke="rgba(232,160,32,0.75)" stroke-width="9" stroke-linecap="round"/>
  <line x1="142" y1="112" x2="142" y2="178" stroke="rgba(232,160,32,0.75)" stroke-width="9" stroke-linecap="round"/>
  <line x1="162" y1="112" x2="162" y2="178" stroke="rgba(232,160,32,0.75)" stroke-width="9" stroke-linecap="round"/>
  <path d="M122 178 Q132 196 142 196 Q152 196 162 178" fill="none" stroke="rgba(232,160,32,0.75)" stroke-width="9" stroke-linecap="round"/>
  <line x1="142" y1="196" x2="142" y2="258" stroke="rgba(232,160,32,0.75)" stroke-width="11" stroke-linecap="round"/>

  <!-- Spoon (right) -->
  <ellipse cx="372" cy="144" rx="22" ry="32" fill="rgba(232,160,32,0.75)"/>
  <line x1="372" y1="176" x2="372" y2="258" stroke="rgba(232,160,32,0.75)" stroke-width="11" stroke-linecap="round"/>
</svg>
