<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Calorie Tracker</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- PROFILE GATE -->
  <div id="profile-gate" class="profile-gate">
    <div class="profile-gate-card">
      <h1>🍽️ Calorie Tracker</h1>

      <div id="profile-list-step">
        <div id="profile-list" class="profile-list"></div>
        <button id="profile-add-btn" class="primary-btn">+ New profile</button>
      </div>

      <div id="profile-pin-step" style="display:none">
        <h2 id="profile-pin-name"></h2>
        <input id="profile-pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4-digit PIN" />
        <button id="profile-pin-submit" class="primary-btn">Enter</button>
        <button id="profile-pin-back" class="link-btn">&larr; back</button>
        <div id="profile-pin-error" class="flag over" style="display:none"></div>
      </div>

      <div id="profile-new-step" style="display:none">
        <h2>Create a profile</h2>
        <input id="profile-new-name" type="text" placeholder="Your name" maxlength="40" />
        <input id="profile-new-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Choose a 4-digit PIN" />
        <input id="profile-new-pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Confirm PIN" />
        <button id="profile-new-submit" class="primary-btn">Create profile</button>
        <button id="profile-new-back" class="link-btn">&larr; back</button>
        <div id="profile-new-error" class="flag over" style="display:none"></div>
      </div>
    </div>
  </div>

  <div id="app-main" class="app">
    <header>
      <h1>🍽️ Calorie Tracker</h1>
      <div class="profile-bar">
        <span id="current-profile-name" class="profile-pill"></span>
        <button id="switch-profile-btn" class="link-btn">Switch profile</button>
      </div>
      <nav>
        <button class="tab-btn active" data-tab="log">Log Meal</button>
        <button class="tab-btn" data-tab="today">Today</button>
        <button class="tab-btn" data-tab="history">History</button>
        <button class="tab-btn" data-tab="plan">Meal Plan</button>
      </nav>
    </header>

    <!-- LOG TAB -->
    <section id="tab-log" class="tab active">
      <div class="card">
        <h2>Speak what you ate</h2>
        <div class="voice-row">
          <button id="mic-btn" class="mic-btn">🎤 Start speaking</button>
          <span id="mic-status" class="muted"></span>
        </div>
        <textarea id="voice-text" placeholder="Your spoken description will appear here — or just type what you ate."></textarea>
        <button id="analyze-text-btn" class="primary-btn">Analyze &amp; Log</button>
      </div>

      <div class="card">
        <h2>Or snap your plate</h2>
        <input id="photo-input" type="file" accept="image/*" capture="environment" />
        <img id="photo-preview" class="photo-preview" style="display:none" />
        <input id="photo-caption" type="text" placeholder="Optional note (e.g. 'no dressing on the salad')" />
        <button id="analyze-photo-btn" class="primary-btn" disabled>Analyze &amp; Log</button>
      </div>

      <div id="result-card" class="card result-card" style="display:none"></div>
    </section>

    <!-- TODAY TAB -->
    <section id="tab-today" class="tab">
      <div class="card totals-card">
        <h2>Today's totals</h2>
        <div id="today-totals" class="totals-grid"></div>
      </div>
      <div id="today-flags"></div>
      <div id="today-list" class="meal-list"></div>
    </section>

    <!-- HISTORY TAB -->
    <section id="tab-history" class="tab">
      <div class="card">
        <label for="history-date">Pick a date</label>
        <input type="date" id="history-date" />
      </div>
      <div class="card totals-card">
        <h2>Totals</h2>
        <div id="history-totals" class="totals-grid"></div>
      </div>
      <div id="history-list" class="meal-list"></div>
    </section>

    <!-- MEAL PLAN TAB -->
    <section id="tab-plan" class="tab">
      <div class="card">
        <h2>Build a 7-day Indian meal plan</h2>
        <label for="plan-calories">Daily calorie target</label>
        <input type="number" id="plan-calories" placeholder="e.g. 2000" min="800" max="6000" />
        <label for="plan-protein">Daily protein target (g)</label>
        <input type="number" id="plan-protein" placeholder="e.g. 120" min="10" max="400" />
        <label>Diet</label>
        <div class="diet-toggle">
          <button type="button" class="diet-btn active" data-diet="veg">🌱 Vegetarian</button>
          <button type="button" class="diet-btn" data-diet="non-veg">🍗 Non-Vegetarian</button>
        </div>
        <button id="generate-plan-btn" class="primary-btn">Generate 7-Day Plan</button>
        <div id="plan-status" class="muted"></div>
      </div>
      <div id="plan-result"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
